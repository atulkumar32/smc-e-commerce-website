<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate manifest" type="application/manifest+json" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Shree Mahaveer Collections — Luxury Handcrafted Bags</title>

    <!-- Theme Colors -->
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: light)" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="description" content="Shree Mahaveer Collections - Bags for a Brighter Tomorrow. Premium School Bags, Backpacks, Laptop Bags & Accessories" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SMC Collections" />

    <!-- Apple / iOS Safari standalone meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMC Collections" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Early PWA Capture & Immediate SW Registration -->
    <script>
      (function() {
        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
          try {
            window.dispatchEvent(new CustomEvent('pwa:install-ready'));
          } catch (_) {}
          console.log('[PWA] beforeinstallprompt event captured and preserved');
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Early Service Worker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Early Service Worker registration error:', err);
            });
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
